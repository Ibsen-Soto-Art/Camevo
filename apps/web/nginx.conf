# Nginx interno del contenedor camevo-web: sirve el build estático de
# Vite. El Nginx del HOST (VPS, ver deploy/nginx/camevo.conf) enruta las
# rutas de la API (/health, /runs) directo a camevo-api antes de llegar
# acá, así que este server nunca ve esas rutas — no hace falta reenviarlas.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
