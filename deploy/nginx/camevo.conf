# Nginx del HOST (VPS Hetzner) para camevo.ibsen-soto.pro — NO va dentro de
# un contenedor: es el Nginx del sistema que ya atiende otros dominios en
# la misma máquina (docs/03-arquitectura.md). Copiar a
# /etc/nginx/sites-available/camevo.conf y enlazar en sites-enabled (o el
# equivalente en /etc/nginx/conf.d/ si el resto de la instalación no usa
# sites-available/enabled).
#
# Enrutamiento: un solo dominio, sin prefijo /api — /health y /runs (que
# cubre tanto el REST de api/rest como el WebSocket de /runs/:id/stream,
# comparten el mismo prefijo) van a camevo-api; todo lo demás es la SPA
# estática de camevo-web. Ver apps/web/src/lib/camevo-client.ts: con
# VITE_API_URL=https://camevo.ibsen-soto.pro (mismo origen que la página),
# el frontend nunca necesita saber que hay dos contenedores detrás.
#
# Certificado: emitido con `certbot certonly --webroot` (NO `--nginx`) para
# que este archivo sea la única fuente de verdad de la config — certbot
# solo escribe los archivos de certificado, nunca edita este .conf. Ver
# deploy/README.md para el comando exacto de emisión/renovación.

upstream camevo_api {
    server 127.0.0.1:3001;
}

upstream camevo_web {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name camevo.ibsen-soto.pro;

    # Requerido por `certbot certonly --webroot` para validar el dominio
    # antes de que exista certificado — debe seguir accesible por HTTP
    # incluso después de tener HTTPS, para la renovación automática.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name camevo.ibsen-soto.pro;

    ssl_certificate     /etc/letsencrypt/live/camevo.ibsen-soto.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camevo.ibsen-soto.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /health {
        proxy_pass http://camevo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cubre REST (/runs, /runs/:id, GET /runs) y el upgrade de WebSocket
    # (/runs/:id/stream) con el mismo location — las cabeceras Upgrade/
    # Connection abajo son las únicas que el WS necesita por encima de un
    # proxy_pass HTTP normal.
    location /runs {
        proxy_pass http://camevo_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://camevo_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
